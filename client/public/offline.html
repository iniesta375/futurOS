<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuturOS — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: rgba(255,255,255,0.7);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .icon {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.88); }
    p  { font-size: 14px; color: rgba(255,255,255,0.4); text-align: center; max-width: 280px; line-height: 1.7; }
    button {
      margin-top: 8px; padding: 10px 24px; border-radius: 10px; border: none;
      background: rgba(99,102,241,0.2); border: 1px solid rgba(99,102,241,0.3);
      color: #818cf8; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">✦</div>
  <h1>FuturOS is offline</h1>
  <p>You appear to be offline. Connect to the internet to access the full portfolio experience.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
